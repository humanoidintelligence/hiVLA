[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hivla"
version = "0.0.3"
description = "A unified serving layer for deploying diverse VLA models."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Peng Li" },
    { name = "Yifei Zhang" },
    { name = "Haozhe Zhang" },
    { name = "Xipeng Qiu" },
]
keywords = ["vla", "humanoid", "deployment", "inference", "serving", "optimization", "vision-language-action"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.21",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
torch = ["torch>=2.0", "safetensors>=0.4"]
onnx = ["onnxruntime-gpu>=1.17"]
tensorrt = ["tensorrt>=10.0"]
# hivla.client (VlaClient / VlaWsClient) and the remote backend.
client = ["httpx>=0.27", "websockets>=12.0", "msgpack>=1.0"]
vision = ["Pillow>=9.0"]
server = ["fastapi>=0.110", "uvicorn>=0.27", "websockets>=12.0", "msgpack>=1.0"]
# `hivla route` (the load-balancing gateway) needs both server and client:
# pip install 'hivla[server,client]'
dev = ["pytest>=7.0", "ruff>=0.4", "fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27", "websockets>=12.0", "msgpack>=1.0"]

[project.scripts]
hivla = "hivla.cli:main"

[project.urls]
Homepage = "https://github.com/humanoidintelligence/hiVLA"
Repository = "https://github.com/humanoidintelligence/hiVLA"
Changelog = "https://github.com/humanoidintelligence/hiVLA/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Built-in serving configs, usable by name: `hivla serve --config gr00t_n1d6_gr1`.
"hivla" = ["configs/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
# External reference checkouts (sglang/RLinf/OpenETA) ship their own test
# suites and pyproject.toml; keep pytest from walking into them.
norecursedirs = ["references", ".git", "*.egg-info", "build", "dist", ".venv"]
